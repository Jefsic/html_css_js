<!DOCTYPE html>
<html lang="port-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
</head>

<body>

    <h1>Testando o uso de um iframe</h1>
    <!-- O tamanho padrão do iframe é 300x150 px, mas pode alterar-->

    <p>Acessando o site do ...
        <iframe src="https://www.cursoemvideo.com" frameborder="2">
            <!-- vai aparecer o texto abaixo caso o navegador não seja compatível -->
            [Seu navegador não é compatível com iframe]
        </iframe>
        para aprender a programar
    </p>

    <p>
        O respositório do Guanabara
        <iframe src="https://gustavoguanabara.github.io" frameborder="1">
            <!-- vai aparecer o código abaixo caso o navegador não seja compatível -->
            <a href="https://gustavoguanabara.github.io" target="_blank">Curso em vídeo</a>
        </iframe>
        também é bem legal
    </p>





</body>

</html>
